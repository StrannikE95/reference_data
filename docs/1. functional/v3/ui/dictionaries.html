<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Справочники</title>
  <style>
    body { font: 14px sans-serif; margin: 24px; }
    h1 { font-size: 18px; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    th, td { border: 1px solid #999; padding: 6px 8px; text-align: left; }
    button, .link { margin: 0 8px 8px 0; }
    .empty { border: 1px dashed #999; padding: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>Справочники</h1>
  <table>
    <thead>
      <tr>
        <th>Код</th>
        <th>Название</th>
        <th>Владелец</th>
        <th>Версия</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>WallMaterial</td>
        <td>Материал стен</td>
        <td>Имущество</td>
        <td>3</td>
        <td><button>Паспорт</button></td>
      </tr>
      <tr>
        <td>OwnershipType</td>
        <td>Вид собственности</td>
        <td>—</td>
        <td>—</td>
        <td><button>Паспорт</button></td>
      </tr>
    </tbody>
  </table>
  <button>Создать новый справочник</button>
  <button>Загрузить ещё</button>
  <p>Выбор строки открывает экран версий.</p>
  <div class="empty">Справочников пока нет</div>
</body>
</html>
