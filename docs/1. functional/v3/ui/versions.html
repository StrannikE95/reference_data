<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Версии справочника</title>
  <style>
    body { font: 14px sans-serif; margin: 24px; }
    h1, h2 { font-size: 18px; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    th, td { border: 1px solid #999; padding: 6px 8px; text-align: left; vertical-align: top; }
    button { margin: 0 6px 6px 0; }
    .head { border: 1px solid #999; padding: 8px 12px; margin-bottom: 12px; }
    .dialog { border: 1px solid #999; padding: 12px; margin-top: 24px; max-width: 420px; }
  </style>
</head>
<body>
  <h1>Версии справочника</h1>
  <div class="head">
    <div>Название: Материал стен</div>
    <div>Код: WallMaterial</div>
    <div>Владелец: Имущество</div>
  </div>
  <button>Загрузить новую версию справочника</button>
  <button>Паспорт</button>
  <button>Отмена</button>
  <table>
    <thead>
      <tr>
        <th>№ версии</th>
        <th>Статус</th>
        <th>Дата С</th>
        <th>Дата ПО</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>4</td>
        <td>Черновик</td>
        <td>23.10.2026</td>
        <td>—</td>
        <td>
          <button>Опубликовать</button>
          <button>Удалить</button>
          <button>Найти</button>
        </td>
      </tr>
      <tr>
        <td>3</td>
        <td>Действует</td>
        <td>01.01.2024</td>
        <td>—</td>
        <td>
          <button>Найти</button>
          <button>Закрыть</button>
        </td>
      </tr>
      <tr>
        <td>2</td>
        <td>Закрыта</td>
        <td>01.01.2023</td>
        <td>31.12.2023</td>
        <td>
          <button>Найти</button>
          <button>Архивировать</button>
        </td>
      </tr>
      <tr>
        <td>1</td>
        <td>В архиве</td>
        <td>01.01.2022</td>
        <td>31.12.2022</td>
        <td></td>
      </tr>
    </tbody>
  </table>

  <div class="dialog">
    <h2>Закрыть версию 3</h2>
    <label>Дата конца <input type="date" value="2026-10-25"></label>
    <div>
      <button>Закрыть</button>
      <button>Отмена</button>
    </div>
  </div>
  <div class="dialog">
    <h2>Удалить черновик 4?</h2>
    <button>Удалить</button>
    <button>Отмена</button>
  </div>
  <div class="dialog">
    <h2>Архивировать версию 2?</h2>
    <button>Архивировать</button>
    <button>Отмена</button>
  </div>
</body>
</html>
