name: reference_data

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: reference_data
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d reference_data && sleep 3 && pg_isready -U app -d reference_data"]
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 5s

  management.api:
    image: ${DOCKER_REGISTRY-}management-api
    build:
      context: ..
      dockerfile: management.api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy

  service.api:
    image: ${DOCKER_REGISTRY-}service-api
    build:
      context: ..
      dockerfile: service.api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy

  import.api:
    image: ${DOCKER_REGISTRY-}import-api
    build:
      context: ..
      dockerfile: import.api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      management.api:
        condition: service_started

volumes:
  pgdata:
